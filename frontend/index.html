<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script>
  // Single portal now — go straight to sign in (or the right dashboard if already logged in)
  const user = getUser();
  if (getToken() && user) {
    window.location.href = user.role === 'super_admin' ? 'companies.html' : 'dashboard.html';
  } else {
    window.location.href = 'user-login.html';
  }
</script>
</body>
</html>
