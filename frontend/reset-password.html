<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Set New Password — Loan Manager</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth-wrap"><div class="auth-card">
<p class="brand">📒 Loan Manager</p><p class="sub">Set a new password</p>
<form id="resetForm"><label for="password">New password</label><input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
<label for="confirm">Confirm password</label><input type="password" id="confirm" required minlength="6">
<button type="submit" class="btn btn-primary btn-block">Reset password</button><p class="error-msg" id="errorMsg"></p><p class="success-msg" id="successMsg"></p></form>
<p class="foot-link"><a href="user-login.html">Go to sign in</a></p>
</div></div><script src="js/api.js"></script><script src="js/reset-password.js"></script></body></html>
