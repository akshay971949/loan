<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Companies — Loan Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <p class="brand">📒 Loan Manager</p>
    <nav>
      <a href="companies.html" class="active">Companies</a>
    </nav>
    <div class="user-box">
      <div class="who" id="whoName">—</div>
      <div id="whoEmail" style="margin-bottom:12px"></div>
      <a href="account.html" class="btn btn-ghost btn-sm" style="margin-bottom:6px;display:block">Change password</a>
      <a href="#" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h1>Companies</h1>
        <p>Every company using this platform, and its admin account</p>
      </div>
      <button class="btn btn-primary" id="addBtn">+ New company</button>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Company</th><th>Admin</th><th>Admin email</th><th>Staff</th><th>Customers</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="companiesBody"></tbody>
      </table>
      <div class="empty-state" id="companiesEmpty" style="display:none">
        <div class="big">🏢</div>
        No companies yet — add the first one.
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="companyModal">
  <div class="modal">
    <h3>New company</h3>
    <p class="sub">Creates the company and its first admin account</p>
    <label for="c_name">Company name</label>
    <input type="text" id="c_name">
    <label for="c_admin_name">Admin's full name</label>
    <input type="text" id="c_admin_name">
    <label for="c_admin_email">Admin's email</label>
    <input type="email" id="c_admin_email">
    <label for="c_admin_password">Admin's password</label>
    <input type="password" id="c_admin_password" placeholder="At least 6 characters">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="companyCancel">Cancel</button>
      <button class="btn btn-primary" id="companySave">Create company</button>
    </div>
    <p class="error-msg" id="companyError"></p>
  </div>
</div>

<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>Reset admin password</h3>
    <p class="sub" id="resetModalSub"></p>
    <label for="r_password">New password</label>
    <input type="password" id="r_password" placeholder="At least 6 characters">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="resetCancel">Cancel</button>
      <button class="btn btn-primary" id="resetConfirm">Reset password</button>
    </div>
    <p class="error-msg" id="resetError"></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/companies.js"></script>
</body>
</html>
