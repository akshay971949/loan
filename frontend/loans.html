<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loans — Loan Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <p class="brand">📒 Loan Manager</p>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="customers.html">Customers</a>
      <a href="loans.html" class="active">Loans</a>
      <a href="staff.html" id="staffNavLink">Staff</a>
    </nav>
    <div class="user-box">
      <div class="who" id="whoName">—</div>
      <div id="whoEmail" style="margin-bottom:12px"></div>
      <a href="account.html" class="btn btn-ghost btn-sm" style="margin-bottom:6px;display:block">Change password</a>
      <a href="#" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h1>Loans</h1>
        <p>All disbursed loans and their status</p>
      </div>
      <div class="toolbar">
        <button class="btn btn-ghost" id="exportBtn">Export CSV</button>
        <button class="btn btn-primary" id="addBtn">+ New loan</button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>ID</th><th>Customer</th><th>Type</th><th class="right">Principal</th><th>Rate/mo</th><th>Tenure</th><th class="right">EMI</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="loansBody"></tbody>
      </table>
      <div class="empty-state" id="loansEmpty" style="display:none">
        <div class="big">💳</div>
        No loans yet — issue your first one.
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="loanModal">
  <div class="modal">
    <h3>New loan</h3>
    <p class="sub">Creates the loan and auto-generates the EMI schedule</p>
    <label for="l_customer">Customer</label>
    <select id="l_customer"></select>
    <div class="grid-2">
      <div><label for="l_type">Loan type</label><input type="text" id="l_type" value="Personal"></div>
      <div><label for="l_principal">Principal amount</label><input type="number" id="l_principal" step="0.01"></div>
    </div>
    <div class="grid-2">
      <div><label for="l_rate">Monthly interest rate (%)</label><input type="number" id="l_rate" step="0.01"></div>
      <div><label for="l_tenure">Tenure (months)</label><input type="number" id="l_tenure"></div>
    </div>
    <label for="l_start">Start date</label>
    <input type="date" id="l_start">
    <p class="muted" id="emiPreview" style="margin-top:12px;font-size:13px"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="loanCancel">Cancel</button>
      <button class="btn btn-primary" id="loanSave">Create loan</button>
    </div>
    <p class="error-msg" id="loanError"></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/loans.js"></script>
</body>
</html>
