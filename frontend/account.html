<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Loan Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="brand">📒 Loan Manager</p>
      <p class="sub">Change your password</p>

      <form id="pwForm">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" required autocomplete="current-password">

        <label for="new_password">New password</label>
        <input type="password" id="new_password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">

        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" required minlength="6" autocomplete="new-password">

        <button type="submit" class="btn btn-primary btn-block">Update password</button>
        <p class="error-msg" id="errorMsg"></p>
        <p class="foot-link" id="successMsg" style="display:none;color:var(--good)">Password updated successfully.</p>
      </form>

      <p class="foot-link" id="backLink"></p>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/account.js"></script>
</body>
</html>
