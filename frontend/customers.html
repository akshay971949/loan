<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Loan Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <p class="brand">📒 Loan Manager</p>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="customers.html" class="active">Customers</a>
      <a href="loans.html">Loans</a>
      <a href="staff.html" id="staffNavLink">Staff</a>
    </nav>
    <div class="user-box">
      <div class="who" id="whoName">—</div>
      <div id="whoEmail" style="margin-bottom:12px"></div>
      <a href="account.html" class="btn btn-ghost btn-sm" style="margin-bottom:6px;display:block">Change password</a>
      <a href="#" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h1>Customers</h1>
        <p>All borrower profiles</p>
      </div>
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search name, phone, email">
        <button class="btn btn-ghost" id="exportBtn">Export CSV</button>
        <button class="btn btn-primary" id="addBtn">+ Add customer</button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Email</th><th>Occupation</th><th>Added</th><th></th></tr>
        </thead>
        <tbody id="customersBody"></tbody>
      </table>
      <div class="empty-state" id="customersEmpty" style="display:none">
        <div class="big">👤</div>
        No customers yet — add your first one.
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="custModal">
  <div class="modal">
    <h3>Add customer</h3>
    <p class="sub">Create a borrower profile</p>
    <div class="grid-2">
      <div><label for="c_name">Full name</label><input type="text" id="c_name"></div>
      <div><label for="c_phone">Phone</label><input type="text" id="c_phone"></div>
    </div>
    <div class="grid-2">
      <div><label for="c_email">Email</label><input type="email" id="c_email"></div>
      <div><label for="c_occupation">Occupation</label><input type="text" id="c_occupation"></div>
    </div>
    <label for="c_address">Address</label>
    <input type="text" id="c_address">
    <div class="grid-2">
      <div><label for="c_idtype">ID proof type</label><input type="text" id="c_idtype" placeholder="Aadhaar / PAN / Passport"></div>
      <div><label for="c_idnum">ID proof number</label><input type="text" id="c_idnum"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="custCancel">Cancel</button>
      <button class="btn btn-primary" id="custSave">Save customer</button>
    </div>
    <p class="error-msg" id="custError"></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
