<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Loan Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <p class="brand">📒 Loan Manager</p>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="customers.html">Customers</a>
      <a href="loans.html">Loans</a>
      <a href="users.html">Users</a>
    </nav>
    <div class="user-box">
      <div class="who" id="whoName">—</div>
      <div id="whoEmail" style="margin-bottom:12px"></div>
      <a href="account.html" class="btn btn-ghost btn-sm" style="margin-bottom:6px;display:block">Change password</a>
      <a href="#" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h1>Dashboard</h1>
        <p>Portfolio overview and EMI collections</p>
      </div>
      <button class="btn btn-ghost" id="exportDueBtn">Export due list (CSV)</button>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="panel">
      <div class="panel-head">
        <h3>Due &amp; overdue EMIs (next 7 days)</h3>
      </div>
      <table>
        <thead>
          <tr><th>Customer</th><th>Phone</th><th>Loan #</th><th>EMI #</th><th>Due date</th><th class="right">Amount</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="dueBody"></tbody>
      </table>
      <div class="empty-state" id="dueEmpty" style="display:none">
        <div class="big">✓</div>
        No EMIs due in the next 7 days.
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="payModal">
  <div class="modal">
    <h3>Record payment</h3>
    <p class="sub" id="payModalSub"></p>
    <label for="payAmount">Amount received</label>
    <input type="number" id="payAmount" step="0.01">
    <label for="payDate">Payment date</label>
    <input type="date" id="payDate">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="payCancel">Cancel</button>
      <button class="btn btn-primary" id="payConfirm">Confirm payment</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
